<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tools & Models Database</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS (if any, though Tailwind handles most) -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Optional: Basic scrollbar styling for better aesthetics */
        body {
            scrollbar-width: thin;
            scrollbar-color: #4a5568 #f7fafc;
        }
        body::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        body::-webkit-scrollbar-track {
            background: #f7fafc;
        }
        body::-webkit-scrollbar-thumb {
            background-color: #4a5568;
            border-radius: 4px;
            border: 2px solid #f7fafc;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">
    <div class="container mx-auto p-4 md:p-8">
        <h1 class="text-4xl md:text-5xl font-extrabold text-center text-blue-700 mb-8 mt-4 leading-tight">
            Comprehensive AI Tools & Models Database
        </h1>

        <!-- Filter Section -->
        <div id="filters" class="bg-white shadow-lg rounded-lg p-6 mb-8 border border-blue-100">
            <h2 class="text-2xl font-semibold text-blue-600 mb-5">Filter Options</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">

                <!-- Search Input -->
                <div>
                    <label for="search" class="block text-sm font-medium text-gray-700 mb-1">Search (Name, Desc.)</label>
                    <input type="text" id="search" placeholder="e.g., GPT, Stable Diffusion"
                           class="w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                </div>

                <!-- Pricing Model Filter -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Pricing Model</label>
                    <div class="flex flex-wrap gap-x-4 gap-y-2" id="filter-pricing-model">
                        <!-- Checkboxes will be inserted here by JS -->
                    </div>
                </div>

                <!-- Modality Filter -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Modality</label>
                    <div class="flex flex-wrap gap-x-4 gap-y-2" id="filter-modality">
                        <label class="inline-flex items-center">
                            <input type="radio" name="modality" value="All" checked class="form-radio text-blue-600">
                            <span class="ml-2">All</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="radio" name="modality" value="Single-modal" class="form-radio text-blue-600">
                            <span class="ml-2">Single-modal</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="radio" name="modality" value="Multi-modal" class="form-radio text-blue-600">
                            <span class="ml-2">Multi-modal</span>
                        </label>
                    </div>
                </div>

                <!-- Modality Type Filter (Conditional) -->
                <div id="filter-modality-type-container" style="display: none;">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Single Modality Type</label>
                    <div class="flex flex-wrap gap-x-4 gap-y-2" id="filter-modality-type">
                        <!-- Checkboxes will be inserted here by JS -->
                    </div>
                </div>

                <!-- Category/Use Case Filter -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Category/Use Case</label>
                    <select id="filter-category" multiple
                            class="w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 h-24 overflow-y-auto">
                        <!-- Options will be inserted here by JS -->
                    </select>
                </div>

                <!-- License Type Filter -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">License Type</label>
                    <select id="filter-license" multiple
                            class="w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 h-24 overflow-y-auto">
                        <!-- Options will be inserted here by JS -->
                    </select>
                </div>

                <!-- Release Year Filter -->
                <div>
                    <label for="filter-year" class="block text-sm font-medium text-gray-700 mb-1">Release Year</label>
                    <select id="filter-year"
                            class="w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                        <option value="">All Years</option>
                        <!-- Options will be inserted here by JS -->
                    </select>
                </div>

                 <!-- API Available Filter -->
                 <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">API Available?</label>
                    <div class="flex flex-wrap gap-x-4 gap-y-2">
                        <label class="inline-flex items-center">
                            <input type="radio" name="api_available" value="All" checked class="form-radio text-blue-600">
                            <span class="ml-2">All</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="radio" name="api_available" value="Yes" class="form-radio text-blue-600">
                            <span class="ml-2">Yes</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="radio" name="api_available" value="No" class="form-radio text-blue-600">
                            <span class="ml-2">No</span>
                        </label>
                    </div>
                </div>

                <!-- Country of Origin Filter -->
                <div>
                    <label for="filter-country" class="block text-sm font-medium text-gray-700 mb-1">Country of Origin</label>
                    <select id="filter-country"
                            class="w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                        <option value="">All Countries</option>
                        <!-- Options will be inserted here by JS -->
                    </select>
                </div>
            </div>
            <div class="mt-6 text-right">
                <button id="reset-filters" class="px-6 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition duration-200 ease-in-out">Reset Filters</button>
            </div>
        </div>

        <!-- Table Section -->
        <div class="overflow-x-auto shadow-lg rounded-lg border border-blue-100">
            <table class="min-w-full divide-y divide-blue-200">
                <thead class="bg-blue-600 text-white sticky top-0 z-10">
                    <tr>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Name</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Developer</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Category</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Pricing</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">License</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Modality</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">API</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Parameters</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Released</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Country</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Description</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Link</th>
                    </tr>
                </thead>
                <tbody id="tools-table-body" class="bg-white divide-y divide-gray-200">
                    <!-- Table rows will be inserted here by JavaScript -->
                </tbody>
            </table>
            <div id="no-results" class="hidden text-center py-8 text-gray-500 text-lg">No tools found matching your filters.</div>
        </div>
    </div>

    <!-- Main JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
